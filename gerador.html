<html>

<head>
    <script src="gerador.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Gerador de Sudoku</h1>
    <div id="game"></div>
    <div style="display: flex;">
        <button class="btnAcao" onclick="marcaProximo()">Marca próximo</button>
        <button class="btnAcao" onclick="preencher()">Preencher</button>
    </div>

    <script>
        const game = document.querySelector('#game');
        let mostrarMarcacoes = true;
        let mostrarUnicaOpcao = true;
        const tabuleiro = [];
        const possibilidades = [];

        function iniciaJogoVazio() {
            for (let i = 0; i < 9; i++) {
                const linha = [];
                const l_possibilidades = [];
                for (let j = 0; j < 9; j++) {
                    linha.push(0);
                    l_possibilidades.push([])
                }
                tabuleiro.push(linha);
                possibilidades.push(l_possibilidades);
            }
            desenhaJogo();
        }

        function verficaDuplicidadeDeValorNaLinha(linha, coluna, valor) {
            const indexLinha = tabuleiro[linha].findIndex((cell, index) => cell == valor && coluna != index);
            if (indexLinha > -1)
                return true;
            return false
        }

        function verificaDuplicidadeDeValorNaColuna(linha, coluna, valor) {
            for (let i = 0; i < 9; i++)
                if (tabuleiro[i][coluna] == valor && i != linha)
                    return true;
            return false;
        }

        function verificaDuplicidadeDeValorNoQuadrante(linha, coluna, valor) {
            const iQuadrante = (Math.floor(linha / 3) * 3);
            const jQuadrante = (Math.floor(coluna / 3) * 3);

            for (let i = iQuadrante; i < iQuadrante + 3; i++) {
                for (let j = jQuadrante; j < jQuadrante + 3; j++) {
                    if (tabuleiro[i][j] == valor && i != linha)
                        return true;
                }
            }
            return false;
        }

        function erroNaLogicaDoJogo(linha, coluna) {
            const valor = tabuleiro[linha][coluna]
            if (valor > 0) {
                return verficaDuplicidadeDeValorNaLinha(linha, coluna, valor) ||
                    verificaDuplicidadeDeValorNaColuna(linha, coluna, valor) ||
                    verificaDuplicidadeDeValorNoQuadrante(linha, coluna, valor);
            }
            return false;
        }

        function definePossibilidades(linha, coluna) {
            const opcoes = []
            for (var valor = 1; valor <= 9; valor++) {
                if (verficaDuplicidadeDeValorNaLinha(linha, coluna, valor) ||
                    verificaDuplicidadeDeValorNaColuna(linha, coluna, valor) ||
                    verificaDuplicidadeDeValorNoQuadrante(linha, coluna, valor))
                    continue;

                //passou...
                opcoes.push(valor);
            }
            possibilidades[linha][coluna] = opcoes;
        }

        function desenhaPossibilidades(linha, coluna) {
            const opcoes = possibilidades[linha][coluna];
            let ret = '';
            for (var i = 1; i <= 9; i++)
                if (opcoes.findIndex(x => x == i) > -1)
                    ret += `<div>${i}</div>`;
                else
                    ret += `<div> </div>`;
            return ret;
        }

        function defineUnicaOpcao() {
            if (mostrarUnicaOpcao) {
                const marcados = document.querySelectorAll('.marcacao')
                if (marcados) {
                    for (var i = 0; i < marcados.length; i++) {
                        const item = marcados[i];
                        const opcoes = [...item.children].filter(x => x.innerText != '');

                        if (opcoes.length == 1) { //so tem essa mesma
                            opcoes[0].classList.add('unicaOpcao')
                            continue;
                        }

                        const row = item.dataset.row;
                        const column = item.dataset.column;

                        for (var j = 0; j < opcoes.length; j++) {
                            const opcao = opcoes[j];

                            const minhaLinha = [...document.querySelectorAll(`.marcacao[data-row="${row}"]`)];
                            const opcaoIgualNaMinhaLinha = minhaLinha.find(x =>
                                x.dataset.column != column && [...x.children].find(x => x.innerText == opcao.innerText)
                            )
                            if (!opcaoIgualNaMinhaLinha) { //sou o unico da linha
                                opcao.classList.add('unicaOpcao')
                                continue;
                            }

                            const minhaColuna = [...document.querySelectorAll(`.marcacao[data-column="${column}"]`)];
                            const opcaoIgualNaMinhaColuna = minhaColuna.find(x =>
                                x.dataset.row != row && [...x.children].find(x => x.innerText == opcao.innerText)
                            )
                            if (!opcaoIgualNaMinhaColuna) { //sou o unico da coluna
                                opcao.classList.add('unicaOpcao')
                                continue;
                            }

                            const iQuadrante = (Math.floor(row / 3) * 3);
                            const jQuadrante = (Math.floor(column / 3) * 3);
                            let souUnicaOpcaoNoQuadrante = true;
                            for (let i = iQuadrante; i < iQuadrante + 3; i++) {
                                for (let j = jQuadrante; j < jQuadrante + 3; j++) {
                                    if (i == row && j == column) //sou eu mesmo kkk
                                        continue;

                                    const cell = document.querySelector(`.marcacao[data-row="${i}"][data-column="${j}"]`)
                                    if (cell) {
                                        const opcaoIgualNoQuadrante = [...cell.children].find(x => x.innerText == opcao.innerText)
                                        if (opcaoIgualNoQuadrante) {
                                            souUnicaOpcaoNoQuadrante = false;
                                            break;
                                        }
                                    }
                                }
                            }
                            if (souUnicaOpcaoNoQuadrante)
                                opcao.classList.add('unicaOpcao')

                        }

                    }
                }
            }
        }

        function desenhaTabuleiro() {
            game.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    let classe = 'cell ';
                    if (i == 0)
                        classe += 'border-top '
                    if (i == 8)
                        classe += 'border-bottom '
                    if (j == 8)
                        classe += 'border-right '
                    if (j == 0)
                        classe += 'border-left '

                    if (i == 0 || i % 3 == 0)
                        classe += 'cell-top '
                    if (i == 8 || (i + 1) % 3 == 0)
                        classe += 'cell-bottom '
                    if (j == 8 || (j + 1) % 3 == 0)
                        classe += 'cell-right '
                    if (j == 0 || j % 3 == 0)
                        classe += 'cell-left '

                    if (erroNaLogicaDoJogo(i, j))
                        classe += 'error '

                    let innerHTML = tabuleiro[i][j] > 0 ? tabuleiro[i][j] : '';
                    if (innerHTML == '' && mostrarMarcacoes) {
                        classe += 'marcacao '
                        definePossibilidades(i, j);
                        innerHTML = desenhaPossibilidades(i, j);
                    }

                    game.innerHTML += `<button class="${classe}" data-row="${i}" data-column="${j}">
                        ${innerHTML}
                    </button>`
                }
            }

            console.log(possibilidades)
            defineUnicaOpcao()
        }

        function desenhaJogo() {
            desenhaTabuleiro();
        }

        function marcaProximo() {
            let celulaComMenosOpcoes = null, xcelulaComMenosOpcoes = null, ycelulaComMenosOpcoes = null;

            const unicaOpcao = document.querySelector('.unicaOpcao');
            if (unicaOpcao) {
                xcelulaComMenosOpcoes = unicaOpcao.parentElement.dataset.row
                ycelulaComMenosOpcoes = unicaOpcao.parentElement.dataset.column
                possibilidades[xcelulaComMenosOpcoes][ycelulaComMenosOpcoes] = [];
                tabuleiro[xcelulaComMenosOpcoes][ycelulaComMenosOpcoes] = Number(unicaOpcao.innerHTML)
            }
            else {
                for (let i = 0; i < possibilidades.length; i++) {
                    const linha = possibilidades[i];
                    for (let j = 0; j < linha.length; j++) {
                        const cell = linha[j];
                        if (cell.length > 0 && (
                            !celulaComMenosOpcoes || cell.length < celulaComMenosOpcoes.length
                        )) {
                            celulaComMenosOpcoes = [...cell];
                            xcelulaComMenosOpcoes = i;
                            ycelulaComMenosOpcoes = j;
                        }
                    }
                }

                possibilidades[xcelulaComMenosOpcoes][ycelulaComMenosOpcoes] = [];
                const opcao = Math.floor(Math.random() * celulaComMenosOpcoes.length)
                tabuleiro[xcelulaComMenosOpcoes][ycelulaComMenosOpcoes] = celulaComMenosOpcoes[opcao];
            }

            desenhaJogo();
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        async function preencher() {
            for (let i = 0; i < 81; i++) {
                marcaProximo()
                await sleep(5);
            }
        }

        iniciaJogoVazio()
    </script>
</body>

</html>
